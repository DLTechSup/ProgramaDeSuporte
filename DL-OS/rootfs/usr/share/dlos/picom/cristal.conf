# Equilibrado: cantos redondos, sombras suaves, transparência leve. Sem blur (rápido).
backend = "glx"; vsync = true; use-damage = true
corner-radius = 16
rounded-corners-exclude = [ "window_type = 'dock'", "class_g = 'Plank'" ]
shadow = true; shadow-radius = 18; shadow-opacity = 0.40; shadow-offset-x = -12; shadow-offset-y = -8
shadow-exclude = [ "class_g = 'Plank'" ]
fading = true; fade-in-step = 0.09; fade-out-step = 0.09; fade-delta = 4
inactive-opacity = 0.92
blur-background = true
blur-method = "dual_kawase"
blur-strength = 6
blur-background-exclude = [ "class_g = 'Plank'" ]
unredir-if-possible = true
detect-client-opacity = true
