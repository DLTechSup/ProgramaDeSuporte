#!/usr/sbin/nft -f
# DL OS: firewall. Bloqueia TUDO que chega de fora; a saída é livre. Para abrir uma porta: dlos-seguranca liberar tcp 22
flush ruleset
table inet filter {
  # IPs bloqueados automaticamente pelo detector (temporário, escalona se reincidir)
  set bloqueados4 { type ipv4_addr; flags timeout; }
  set bloqueados6 { type ipv6_addr; flags timeout; }
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ip saddr @bloqueados4 drop
    ip6 saddr @bloqueados6 drop
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 5/second accept
    ip6 nexthdr icmpv6 icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept
    include "/etc/nftables.d/*.nft"
    # registra tentativas novas vindas de fora (alimenta o detector de intrusão); o que sobra é descartado
    pkttype unicast ct state new limit rate 30/second burst 50 packets log prefix "DLOS-BLOQUEADO " level info
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  {
    type filter hook output priority 0; policy accept;
    ip daddr @bloqueados4 drop      # corta também a saída para atacantes (ex.: shell reverso)
    ip6 daddr @bloqueados6 drop
  }
}
