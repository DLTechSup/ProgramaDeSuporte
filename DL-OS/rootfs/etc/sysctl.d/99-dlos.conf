# DL OS: responsividade
vm.swappiness=150            # com zram, trocar para memória comprimida é barato
vm.page-cluster=0            # sem read-ahead no swap (zram)
vm.vfs_cache_pressure=50     # mantém pastas/arquivos em cache: abrir pastas instantâneo
vm.dirty_background_ratio=5
vm.dirty_ratio=15
kernel.sched_autogroup_enabled=1   # janela em foco ganha prioridade sobre tarefas de fundo
