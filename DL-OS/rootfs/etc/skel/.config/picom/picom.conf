# Compositor leve: cantos arredondados e sombra suave, sem fade/blur (ligue blur se tiver GPU boa)
backend = "glx"; vsync = true; use-damage = true
fading = false; shadow = true; shadow-radius = 12; shadow-opacity = 0.35
corner-radius = 10
blur-background = false
unredir-if-possible = true     # tela cheia/vídeo sem compositor = sem perda de desempenho
detect-client-opacity = true
