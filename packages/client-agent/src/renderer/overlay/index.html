<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>NexoDesk - Sessao de suporte em andamento</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        cursor: none;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #d7dadf;
        text-align: center;
        user-select: none;
      }
      .icon {
        font-size: 48px;
        margin-bottom: 16px;
        opacity: 0.85;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0 0 8px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        margin: 0;
        max-width: 520px;
        line-height: 1.5;
        color: #9aa0aa;
      }
      .hint {
        position: absolute;
        bottom: 28px;
        font-size: 12px;
        color: #565b64;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">&#128274;</div>
      <h1>Sessao de suporte em andamento</h1>
      <p>
        A tela foi ocultada para sua privacidade enquanto o tecnico realiza o atendimento.
        Voce nao precisa fazer nada agora.
      </p>
      <div class="hint">
        Para encerrar esta sessao e recuperar o controle imediatamente, pressione
        Ctrl + Alt + Shift + F9
      </div>
    </div>
  </body>
</html>
