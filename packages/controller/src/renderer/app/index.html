<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src * ws: wss:; media-src 'self' blob:;" />
    <title>NexoDesk Controlador</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #2d6cdf;
        --brand-dark: #1c4fb0;
        --bg: #10131a;
        --panel: #1a1f2b;
        --text: #eef1f6;
        --muted: #97a0b3;
        --danger: #e5534b;
        --success: #2fb872;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .screen {
        height: 100vh;
        display: flex;
      }
      /* --- Tela de conexao --- */
      #screen-connect {
        align-items: center;
        justify-content: center;
      }
      .connect-card {
        background: var(--panel);
        border-radius: 14px;
        padding: 32px;
        width: 360px;
        text-align: center;
      }
      .connect-card h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .connect-card .subtitle {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 20px;
      }
      .connect-card input {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 10px;
        border-radius: 8px;
        border: 1px solid #2c3242;
        background: #0d1017;
        color: var(--text);
        font-size: 15px;
      }
      .connect-card button {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 14px;
      }
      .connect-card button:hover { background: var(--brand-dark); }
      .connect-card button:disabled { opacity: 0.6; cursor: default; }
      #connect-error {
        color: var(--danger);
        font-size: 13px;
        margin-top: 10px;
      }
      #connect-status {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }
      /* --- Tela do visualizador --- */
      #screen-viewer {
        flex-direction: column;
        width: 100%;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid #262c3a;
      }
      .toolbar h2 {
        font-size: 14px;
        margin: 0;
        margin-right: auto;
        font-weight: 600;
      }
      .toolbar button {
        padding: 7px 12px;
        border-radius: 7px;
        border: 1px solid #333a4b;
        background: #232838;
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
      }
      .toolbar button.active {
        background: var(--brand);
        border-color: var(--brand);
      }
      .toolbar button#btn-end-session {
        background: var(--danger);
        border-color: var(--danger);
      }
      #viewer-status {
        font-size: 11px;
        color: var(--muted);
        padding: 4px 14px;
      }
      .video-wrap {
        flex: 1;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #remote-video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        outline: none;
      }
      #file-transfer-status {
        font-size: 11px;
        color: var(--muted);
        padding: 4px 14px;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div id="screen-connect" class="screen">
      <div class="connect-card">
        <h1>NexoDesk Controlador</h1>
        <div class="subtitle">Peca ao cliente o ID e a senha exibidos no NexoDesk dele.</div>
        <input id="input-agent-id" placeholder="ID do computador (ex: 123 456 789)" autocomplete="off" />
        <input id="input-password" placeholder="Senha da sessao" autocomplete="off" />
        <button id="btn-connect">Conectar</button>
        <div id="connect-error" hidden></div>
        <div id="connect-status"></div>
      </div>
    </div>

    <div id="screen-viewer" class="screen" hidden>
      <div class="toolbar">
        <h2 id="viewer-title">-</h2>
        <button id="btn-toggle-privacy">Ativar tela preta (privacidade)</button>
        <button id="btn-send-file">Enviar arquivo</button>
        <button id="btn-end-session">Encerrar sessao</button>
      </div>
      <div id="viewer-status"></div>
      <div class="video-wrap">
        <video id="remote-video" autoplay playsinline></video>
      </div>
      <div id="file-transfer-status"></div>
    </div>

    <script type="module" src="./index.js"></script>
  </body>
</html>
