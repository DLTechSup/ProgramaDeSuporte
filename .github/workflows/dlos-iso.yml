name: DL OS - gerar ISO
on:
  workflow_dispatch:
  push:
    paths: ["DL-OS/**"]
jobs:
  iso:
    runs-on: ubuntu-latest
    container: { image: "debian:trixie", options: --privileged }
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y sudo
      - run: ./DL-OS/build/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: DL-OS-iso, path: DL-OS/out/*.iso }
