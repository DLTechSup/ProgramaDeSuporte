name: Build Central Informax (tudo num instalador só)

# Compila as ferramentas (cada uma é independente: se uma falhar, as outras seguem) e
# empacota TUDO + a Demanda do Dia num único instalador: CentralInformax-Instalador.exe.
# Baixe em Actions > (execução) > Artifacts.

on:
  workflow_dispatch:
  push:
    branches: [claude/jolly-goldberg-fkl1qj, main, master]
    paths: ["Central/**", ".github/workflows/build-central.yml"]

permissions:
  contents: read
  actions: read

jobs:
  python:
    name: Ferramenta ${{ matrix.id }}
    runs-on: windows-2022
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        id: [nomes-calcados, monitor-demandas, renomeador, captura-tela, executar-py, separador-fotos]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compilar
        shell: pwsh
        run: ./Central/scripts/empacotar-ferramenta.ps1 -Id ${{ matrix.id }} -Saida "$env:RUNNER_TEMP/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferr-${{ matrix.id }}
          path: ${{ runner.temp }}/out/${{ matrix.id }}/**

  electron:
    name: Ferramenta ${{ matrix.id }}
    runs-on: windows-2022
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        id: [editor-fotos, limpador-usb]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compilar
        shell: pwsh
        run: ./Central/scripts/empacotar-ferramenta.ps1 -Id ${{ matrix.id }} -Saida "$env:RUNNER_TEMP/out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferr-${{ matrix.id }}
          path: ${{ runner.temp }}/out/${{ matrix.id }}/**

  suporte:
    name: Suporte remoto (reaproveita a última compilação pronta)
    runs-on: ubuntu-22.04
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Baixar os instaladores do Suporte remoto
        shell: bash
        run: |
          set -e
          RUN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow build-windows.yml --branch "${GITHUB_REF_NAME}" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          [ -n "$RUN" ] || { echo "nenhuma compilação do Suporte remoto encontrada"; exit 1; }
          echo "usando a execução $RUN"
          for ed in tecnico cliente; do
            mkdir -p "dl/$ed" "out/suporte-$ed"
            gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "SuporteInformax-$ed-windows-x64" -D "dl/$ed"
            cp "dl/$ed"/*instalador*.exe "out/suporte-$ed/"
          done
          ls -la out/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferr-suporte-tecnico
          path: out/suporte-tecnico/**
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferr-suporte-cliente
          path: out/suporte-cliente/**

  central:
    name: Central Informax (instalador único)
    needs: [python, electron, suporte]
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    defaults:
      run:
        working-directory: Central
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Central/package-lock.json
      - run: npm ci
      - name: Testes (núcleo, ferramentas, interface e monitor contra página simulada)
        shell: bash
        run: |
          npm i --no-save playwright
          npx playwright install chromium
          npm test
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: ferr-*
          path: ${{ runner.temp }}/ferr
      - name: Colocar as ferramentas dentro da Central
        shell: pwsh
        run: |
          $dl = Join-Path $env:RUNNER_TEMP 'ferr'
          if (Test-Path $dl) {
            Get-ChildItem $dl -Directory | ForEach-Object {
              $id = $_.Name -replace '^ferr-', ''
              $dest = Join-Path 'ferramentas' $id
              New-Item -ItemType Directory -Force $dest | Out-Null
              Copy-Item -Recurse -Force "$($_.FullName)\*" $dest
              "{0}: {1} arquivo(s)" -f $id, (Get-ChildItem $dest -Recurse -File).Count
            }
          } else { "nenhuma ferramenta foi baixada" }
      - name: Gerar o instalador
        run: npm run dist
      - name: Conferir
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }
          if (-not (Get-ChildItem release -Filter *.exe)) { throw "instalador não foi gerado" }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CentralInformax-Instalador
          path: Central/release/*.exe
