name: Gerar executável (Renomeador em Massa)
on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-ramanujan-g27161]
    paths: ["renomeador-em-massa/**", ".github/workflows/build-renomeador.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: renomeador-em-massa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller pytest
      - name: Testes automáticos
        run: python -m pytest -q tests
      - name: Gerar o programa (.exe com ícone e versão)
        run: >
          pyinstaller --noconfirm --onedir --noconsole --name RenomeadorEmMassa
          --icon assets/icone.ico --version-file installer/versao.txt --add-data "assets;assets"
          --collect-all customtkinter --collect-all pystray
          programa.py
      - name: Teste do programa (atalho global, Explorador, janela, renomear, desfazer, bandeja)
        shell: pwsh
        run: |
          $pasta = "dist\RenomeadorEmMassa"
          $p = Start-Process -FilePath "$pasta\RenomeadorEmMassa.exe" -ArgumentList "--selftest" -PassThru
          $p.WaitForExit(120000) | Out-Null
          Get-ChildItem "$pasta\selftest_*.txt" -ErrorAction SilentlyContinue | ForEach-Object { "--- " + $_.Name; Get-Content $_.FullName }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path "$pasta\selftest_erro.txt") { throw "selftest falhou (veja acima)" }
          if (-not (Test-Path "$pasta\selftest_ok.txt")) { throw "o programa não terminou o selftest" }
          Remove-Item "$pasta\selftest_*.txt" -ErrorAction SilentlyContinue
      - name: Instalar o Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Gerar o instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\renomeador.iss
          if (-not (Test-Path saida\RenomeadorEmMassa-Instalador-1.0.0.exe)) { throw "instalador não foi gerado" }
      - name: Versão portátil (zip)
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.md dist\RenomeadorEmMassa\
          Compress-Archive -Path dist\RenomeadorEmMassa -DestinationPath saida\RenomeadorEmMassa-portatil.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: renomeador-${{ github.run_number }}
          name: Renomeador em Massa (Windows) #${{ github.run_number }}
          files: |
            renomeador-em-massa/saida/RenomeadorEmMassa-Instalador-1.0.0.exe
            renomeador-em-massa/saida/RenomeadorEmMassa-portatil.zip
