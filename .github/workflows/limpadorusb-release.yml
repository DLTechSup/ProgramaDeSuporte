name: LimpadorUSB - build e release

on:
  push:
    tags: ['limpadorusb-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: LimpadorUSB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LimpadorUSB/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: LimpadorUSB
          path: LimpadorUSB/release/*.exe
      - name: Versão
        id: versao
        shell: bash
        run: echo "v=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('limpadorusb-v{0}', steps.versao.outputs.v) }}
          target_commitish: ${{ github.sha }}
          name: LimpadorUSB ${{ steps.versao.outputs.v }}
          body: |
            Limpador USB de Impressoras para Windows 10 e 11 (não precisa instalar; abre pedindo administrador).
            - `LimpadorUSB-x64.exe` — Windows de 64 bits
            - `LimpadorUSB-ia32.exe` — Windows de 32 bits
          files: LimpadorUSB/release/*.exe
