name: Gerar executável (Monitor de Demandas)
on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-ramanujan-g27161]
    paths: ["monitor-whatsapp/**", ".github/workflows/build-monitor-whatsapp.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: monitor-whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller pytest
      - name: Testes automáticos (com o Edge de verdade, sem tela)
        env:
          CHROMIUM_PATH: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        run: python -m pytest -q tests
      - name: Gerar o programa (.exe com ícone e versão)
        run: >
          pyinstaller --noconfirm --onedir --noconsole --name MonitorDeDemandas
          --icon assets/icone.ico --version-file installer/versao.txt --add-data "assets;assets"
          --collect-all playwright --collect-all customtkinter --collect-all pystray
          --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all rapidfuzz
          programa.py
      - name: Teste do programa (janela + bandeja + Edge sem tela + leitura + OCR)
        shell: pwsh
        run: |
          $pasta = "dist\MonitorDeDemandas"
          $p = Start-Process -FilePath "$pasta\MonitorDeDemandas.exe" -ArgumentList "--selftest" -PassThru
          $p.WaitForExit(130000) | Out-Null
          Get-ChildItem "$pasta\selftest_*.txt" -ErrorAction SilentlyContinue | ForEach-Object { "--- " + $_.Name; Get-Content $_.FullName }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path "$pasta\selftest_erro.txt") { throw "selftest falhou (veja acima)" }
          if (-not (Test-Path "$pasta\selftest_ok.txt")) { throw "o programa não terminou o selftest" }
          Remove-Item "$pasta\selftest_*.txt" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$pasta\perfil_whatsapp", "$pasta\config.json" -ErrorAction SilentlyContinue
      - name: Instalar o Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Gerar o instalador
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\monitor.iss
          if (-not (Test-Path saida\MonitorDeDemandas-Instalador-1.0.0.exe)) { throw "instalador não foi gerado" }
      - name: Versão portátil (zip)
        shell: pwsh
        run: |
          Copy-Item marcas.txt, LEIA-ME.md dist\MonitorDeDemandas\
          Compress-Archive -Path dist\MonitorDeDemandas -DestinationPath saida\MonitorDeDemandas-portatil.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: monitor-${{ github.run_number }}
          name: Monitor de Demandas (Windows) #${{ github.run_number }}
          files: |
            monitor-whatsapp/saida/MonitorDeDemandas-Instalador-1.0.0.exe
            monitor-whatsapp/saida/MonitorDeDemandas-portatil.zip
