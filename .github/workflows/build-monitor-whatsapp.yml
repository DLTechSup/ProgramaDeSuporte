name: Gerar executável (Monitor de Demandas)
on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-ramanujan-g27161]
    paths: ["monitor-whatsapp/**", ".github/workflows/build-monitor-whatsapp.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: monitor-whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pyinstaller pytest
      - name: Testes automáticos (com o Edge de verdade, sem tela)
        env:
          CHROMIUM_PATH: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        run: python -m pytest -q tests
      - name: Gerar .exe
        run: >
          pyinstaller --onefile --noconsole --name MonitorDeDemandas
          --collect-all playwright --collect-all customtkinter
          --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all rapidfuzz
          programa.py
      - name: Montar pacote
        shell: pwsh
        run: |
          New-Item -ItemType Directory pacote | Out-Null
          Copy-Item dist\MonitorDeDemandas.exe pacote\
          Copy-Item marcas.txt, LEIA-ME.md pacote\
      - name: Teste do .exe (janela + Edge sem tela + leitura + OCR)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath pacote\MonitorDeDemandas.exe -ArgumentList "--selftest" -PassThru
          $p.WaitForExit(130000) | Out-Null
          Get-ChildItem pacote\selftest_*.txt -ErrorAction SilentlyContinue | ForEach-Object { "--- " + $_.Name; Get-Content $_.FullName }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (Test-Path pacote\selftest_erro.txt) { throw "selftest falhou (veja acima)" }
          if (-not (Test-Path pacote\selftest_ok.txt)) { throw "o .exe não terminou o selftest" }
          Remove-Item pacote\selftest_*.txt -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force pacote\perfil_whatsapp, pacote\config.json -ErrorAction SilentlyContinue
      - name: Empacotar
        shell: pwsh
        run: Compress-Archive -Path pacote\* -DestinationPath MonitorDeDemandas-Windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: monitor-${{ github.run_number }}
          name: Monitor de Demandas (Windows) #${{ github.run_number }}
          files: monitor-whatsapp/MonitorDeDemandas-Windows.zip
