name: Build Demanda do Dia (Windows)

# Gera o programa "Demanda do Dia" (pasta "Automação WhatsApp") para Windows.
# Baixe em Actions > (execução) > Artifacts.

on:
  workflow_dispatch:
  push:
    branches: [claude/jolly-goldberg-fkl1qj, main, master]
    paths: ["Automação WhatsApp/**", ".github/workflows/build-demanda.yml"]

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: "Automação WhatsApp"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes da lógica (marca, referência, pastas, lista)
        run: python -m pytest -q tests/test_core.py

      - name: Gerar o programa
        run: python -m PyInstaller --noconfirm --onedir --noconsole --name DemandaWhatsApp main.py

      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path dist/DemandaWhatsApp -DestinationPath ../DemandaWhatsApp-windows-x64.zip

      - name: Enviar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DemandaWhatsApp-windows-x64
          path: DemandaWhatsApp-windows-x64.zip
