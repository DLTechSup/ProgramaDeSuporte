name: Build Demanda do Dia - Python (antiga)

# Gera o programa "Demanda do Dia" (pasta "Automação WhatsApp") para Windows.
# Baixe em Actions > (execução) > Artifacts.

# VERSÃO ANTIGA (Python/Qt). A versão atual é a em React: "Build Demanda do Dia (React/Electron)".
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: "Automação WhatsApp"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes da lógica (marca, referência, pastas, lista)
        run: python -m pytest -q tests/test_core.py

      - name: Gerar o programa
        run: python -m PyInstaller --noconfirm --onedir --noconsole --name DemandaWhatsApp --icon assets/icone.ico --add-data "assets;assets" main.py

      - name: Instalar o Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Gerar o instalador (Setup)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\demanda.iss
          if (-not (Test-Path saida\DemandaDoDia-Instalador.exe)) { throw "instalador não foi gerado" }

      - name: Compactar a versão portátil
        shell: pwsh
        run: Compress-Archive -Path dist/DemandaWhatsApp -DestinationPath saida/DemandaWhatsApp-portatil.zip

      - name: Enviar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DemandaDoDia-windows-x64
          path: |
            Automação WhatsApp/saida/DemandaDoDia-Instalador.exe
            Automação WhatsApp/saida/DemandaWhatsApp-portatil.zip
